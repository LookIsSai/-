<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHIVO 0x3F</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #bdbdbd;
    font-family: "Courier New", Courier, monospace;
    overflow: hidden;
  }
  canvas#static {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.07;
    pointer-events: none;
  }
  .scan {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  main {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  h1 {
    font-size: 1.1rem;
    letter-spacing: 0.4em;
    font-weight: normal;
    margin: 0;
    animation: flick 5s infinite;
  }
  p {
    margin: 0;
    font-size: 0.8rem;
    opacity: 0.5;
    line-height: 1.8;
  }
  #t {
    font-size: 0.7rem;
    opacity: 0.35;
    font-variant-numeric: tabular-nums;
  }
  a.btn {
    color: #bdbdbd;
    text-decoration: none;
    border: 1px solid #444;
    padding: 10px 24px;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
  }
  a.btn:hover {
    background: #bdbdbd;
    color: #000;
  }
  @keyframes flick {
    0%, 19%, 21%, 60%, 62%, 100% { opacity: 1; }
    20%, 61% { opacity: 0.2; }
  }
</style>
</head>
<body>
<canvas id="static"></canvas>
<div class="scan"></div>

<main>
  <h1 id="title">ARCHIVO 0x3F</h1>
  <p>NO RECUERDO HABERLO GRABADO.<br>ESTE ARCHIVO NO DEBERÍA ESTAR AQUÍ.</p>
  <div id="t">00:00:00</div>
  <a class="btn" href="شاید ایہ تہانوں مار دیوے۔.zip" download>DESCARGAR</a>
  <p id="warn" style="opacity:0;">NO CIERRE ESTA PÁGINA</p>
</main>

<script>
  // Ruido de fondo
  const c = document.getElementById("static");
  const ctx = c.getContext("2d");
  function resize() {
    c.width = Math.floor(innerWidth / 3);
    c.height = Math.floor(innerHeight / 3);
  }
  resize();
  addEventListener("resize", resize);
  (function noise() {
    const img = ctx.createImageData(c.width, c.height);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    setTimeout(() => requestAnimationFrame(noise), 60);
  })();

  // Cronómetro que nadie inició
  const t = document.getElementById("t");
  const start = Date.now();
  setInterval(() => {
    const s = Math.floor((Date.now() - start) / 1000);
    const h = String(Math.floor(s / 3600)).padStart(2, "0");
    const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
    const sec = String(s % 60).padStart(2, "0");
    t.textContent = `${h}:${m}:${sec}`;
  }, 1000);

  // Glitches del título
  const title = document.getElementById("title");
  const original = title.textContent;
  setInterval(() => {
    if (Math.random() < 0.25) {
      const chars = original.split("");
      const i = Math.floor(Math.random() * chars.length);
      if (chars[i] !== " ") chars[i] = "█";
      title.textContent = chars.join("");
      setTimeout(() => title.textContent = original, 120);
    }
  }, 2000);

  // Aviso tardío
  setTimeout(() => {
    document.getElementById("warn").style.transition = "opacity 3s";
    document.getElementById("warn").style.opacity = "0.6";
  }, 25000);
</script>
</body>
</html>
